[compileJava, compileTestJava]*.options*.encoding = "UTF-8"
sourceSets.main.java.srcDirs = ["src/"]
sourceSets.main.resources.srcDirs = ["../assets"]

project.ext.mainClassName = "cn.harryh.arkpets.DesktopLauncher"
project.ext.assetsDir = new File("../assets")
eclipse.project.name = appName + "-desktop"

import org.gradle.internal.os.OperatingSystem

processResources {
    includeEmptyDirs = false
    excludes = [
            "**/models_enemies/**",
            "**/models/**",
            "**/logs/**",
            "models_data.json"
    ]
}

def sentryDsn = (project.findProperty("SENTRY_DSN") ?: "").trim()

// Runs the app without debug.
tasks.register("run", JavaExec) {
    dependsOn = ["classes"]
    group = "execute"

    mainClass = mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = assetsDir

    setIgnoreExitValue(true)

    jvmArgs += "-Dfile.encoding=UTF-8"
    if (sentryDsn)
        jvmArgs += "-Dsentry.dsn=${sentryDsn}"

    if (OperatingSystem.current() == OperatingSystem.MAC_OS) {
        jvmArgs += "-XstartOnFirstThread" // Required to run on macOS
    }
}

// Runs the app within debug.
tasks.register("debug", JavaExec) {
    dependsOn = ["classes"]
    group = "execute"

    mainClass = mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = assetsDir

    setIgnoreExitValue(true)
    setDebug(true)

    jvmArgs += "-Dfile.encoding=UTF-8"
    if (sentryDsn)
        jvmArgs += "-Dsentry.dsn=${sentryDsn}"
}


/* DISTRIBUTION TASKS */

ext {
    // Environment vars
    rootDir = project.rootDir
    javaHome = System.getProperty('java.home')
    osName = System.getProperty('os.name').toLowerCase(Locale.ROOT).split(' ')[0]
    osPathSep = File.pathSeparatorChar
    // Distribution related vars
    jarLibDir = layout.buildDirectory.dir("libs").get().toString()
    jarLibName = project.name + "-" + project.version
    jlinkDir = layout.buildDirectory.dir("jlink").get().toString()
    jlinkModuleList = "java.base,java.desktop,java.logging,java.management,java.scripting,jdk.crypto.ec,jdk.localedata,jdk.management,jdk.unsupported"
    jlinkLocalesList = "en-US,zh-CN"
    jpackageDir = layout.buildDirectory.dir("jpackage").get().toString()
    issFileRel = "docs/scripts/ExePacking.iss"
    distDir = layout.buildDirectory.dir("dist").get().toString()
    distName = project.appName + "-v" + project.version
    // Oracle's distrusted certificate list (see the security hardening section below).
    // These files are downloaded manually from Oracle and refreshed when advisories are published.
    blockedCertsFile = file(osName.contains("windows")
            ? "security/win-blocked.certs"
            : "security/unix-blocked.certs")
}

// Parses a blocked.certs file and merges its entries into the given state.
// The file format is read by sun.security.util.UntrustedCertificates through java.util.Properties,
// so every non-comment line is a SHA-256 fingerprint and "Algorithm=SHA-256" selects the digest.
def readBlockedCerts = { File source, Map<String, Object> state ->
    if (!source.isFile()) return
    source.readLines("UTF-8").each { raw ->
        def line = raw.trim()
        if (line.isEmpty() || line.startsWith("#") || line.startsWith("!")) return
        if (line.startsWith("Algorithm=")) {
            state.algorithm = line.substring("Algorithm=".length()).trim()
            return
        }
        def key = (line.contains("=") ? line.substring(0, line.indexOf("=")) : line).trim()
        if (key.toUpperCase(Locale.ROOT) ==~ /[0-9A-F]{64}/) {
            state.hashes.add(key.toUpperCase(Locale.ROOT))
        }
    }
}

// Generates a distributable JAR file for the app.
tasks.register("distJar", Jar) {
    dependsOn = ["classes"]
    group = "dist"

    doLast() {
        copy {
            from "${jarLibDir}/${jarLibName}.jar"
            into distDir
            rename "${jarLibName}.jar", "${distName}.jar"
        }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': mainClassName
    }
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}

// Creates a customized Java Runtime Environment for the app.
tasks.register("jlink", Exec) {
    dependsOn = ["distJar"]
    group = "dist"

    doFirst() { delete jlinkDir }

    workingDir project.projectDir
    inputs.property("runtime", "${jlinkDir}/runtime")
    inputs.file(blockedCertsFile)
    commandLine = [
            "${javaHome}/bin/jlink",
            '--module-path', "${javaHome}/jmods",
            '--add-modules', jlinkModuleList,
            '--output', "${jlinkDir}/runtime",
            '--strip-debug',
            '--no-header-files',
            '--no-man-pages',
            '--vm=server',
            '--compress=1',
            '--include-locales', jlinkLocalesList
    ] as List<String>
    outputs.dir(jlinkDir)

    // Hardens the bundled runtime: distrusts the compromised eMudhra intermediate CAs
    // and any other certificates listed in Oracle's blocked.certs (advisory, 2026-10-20).
    doLast() {
        def target = file("${jlinkDir}/runtime/lib/security/blocked.certs")
        def state = [algorithm: "SHA-256", hashes: new LinkedHashSet<String>()]
        readBlockedCerts(target, state)
        readBlockedCerts(blockedCertsFile, state)
        target.parentFile.mkdirs()
        target.setText(
                "# Hardened by ArkPets. Generated by the Gradle task 'jlink'. Do not edit.\n" +
                        "Algorithm=${state.algorithm}\n" +
                        state.hashes.join("\n") + "\n",
                "UTF-8")
        logger.lifecycle("Injected ${state.hashes.size()} blocked certificate hashes into the bundled runtime.")
    }
}

// Packs the app into an EXE.
tasks.register("jpackage", Exec) {
    dependsOn = ["jlink"]
    group = "dist"

    doFirst() {
        fileTree(jarLibDir).size()
        if (fileTree(jarLibDir).size() > 1)
            throw new RuntimeException("There may be legacy jars in the libs dir, please run 'clean' first.")
        delete jpackageDir
    }
    doLast() {
        copy {
            from "${rootDir}/LICENSE"
            into jpackageDir
        }
    }

    workingDir project.projectDir
    def commands = [
            "${javaHome}/bin/jpackage",
            '--input', jarLibDir,
            '--dest', jpackageDir,
            '--type', 'app-image',
            '--name', appName,
            '--vendor', appAuthor,
            '--app-version', project.version,
            '--main-class', mainClassName,
            '--main-jar', jar.archiveFile.get().asFile.getName(),
            '--runtime-image', "${jlinkDir}/runtime",
            '--java-options', '-Dfile.encoding=UTF-8',
            '--java-options', '-Dsentry.environment=production'
    ]
    if (sentryDsn) {
        commands << '--java-options'
        commands << "-Dsentry.dsn=${sentryDsn}"
    }
    if (osName.contains('windows')) {
        commands << '--icon'
        commands << "${assetsDir}/icons/icon.ico"
    } else if (osName.contains('linux')) {
        commands << '--icon'
        commands << "${assetsDir}/icons/icon.png"
    } else if (osName.contains('mac')) {
        commands << '--java-options'
        commands << "-XstartOnFirstThread"
    }
    commandLine = commands as List<String>
}

// Generates a distributable ZIP file for the app.
tasks.register("distZip", Zip) {
    dependsOn = ["jpackage"]
    group = "dist"

    from(jpackageDir) { include("**") }
    from(rootDir) { include("README.md") }
    archiveFileName = "${distName}.zip"
    destinationDirectory = file(distDir)
}

// Generates a distributable EXE file for the app, using Inno Setup.
// Note that you must install Inno Setup in your environment and add it to PATH before running this task.
tasks.register("distExe", Exec) {
    dependsOn = ["jpackage"]
    group = "dist"

    workingDir rootDir
    def commands = [
            "iscc",
            "/Q",
            issFileRel
    ]
    commandLine = commands
}

// Generates ALL kinds of distributing files.
tasks.register("distAll") {
    dependsOn = ["distJar", "distZip", "distExe"]
    group = "dist"

    doLast() {
        logger.lifecycle("All files were successfully generated, see: ${new File(distDir as String).absolutePath}")
        try {
            delete jarLibDir
            delete jlinkDir
            delete jpackageDir
        } catch (Exception ignored) {
            logger.lifecycle("Unable to delete temp files.")
        }
    }
}
